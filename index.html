<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우주탐사의 역사 퀴즈 대결</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0f24; --bg2:#141b3d; --ink:#f4f6ff; --muted:#a9b2d6;
  --gold:#ffd166; --photo:#ff8a3d; --photo2:#e2602a; --text:#27b5c4; --text2:#14889a;
  --order:#7b6cf6; --order2:#5546d6; --ok:#3ddc97; --bad:#ff5d73;
  --p1:#ff6b6b; --p2:#4dabf7; --p3:#51cf66; --p4:#fcc419;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  color:var(--ink); background:var(--bg);
  background-image:
    radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),
    radial-gradient(1px 1px at 72% 12%,#fff9 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 40% 70%,#fff7 50%,transparent 51%),
    radial-gradient(1px 1px at 88% 60%,#fff8 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 22% 88%,#fff6 50%,transparent 51%),
    radial-gradient(1px 1px at 58% 38%,#fff6 50%,transparent 51%),
    radial-gradient(1px 1px at 95% 92%,#fff7 50%,transparent 51%),
    radial-gradient(900px 600px at 85% -10%,#3a2a8a55,transparent 70%),
    radial-gradient(800px 600px at -10% 110%,#0f5f7a44,transparent 70%);
  background-size:300px 300px,340px 340px,420px 420px,380px 380px,460px 460px,280px 280px,500px 500px,100% 100%,100% 100%;
  background-attachment:fixed;
}
h1,h2,h3,.jua{font-family:'Jua','Apple SD Gothic Neo',sans-serif;font-weight:400}
button{font-family:inherit;cursor:pointer;border:0}
.hidden{display:none!important}
.wrap{max-width:1280px;margin:0 auto;padding:16px 20px 40px}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar h2{font-size:clamp(20px,2.6vw,30px);margin-right:auto;letter-spacing:.5px}
.btn{background:#ffffff14;color:var(--ink);padding:10px 16px;border-radius:999px;font-size:16px;border:1px solid #ffffff2a;transition:.15s}
.btn:hover{background:#ffffff26}
.btn.primary{background:var(--gold);color:#2a1d00;border-color:transparent;font-family:'Jua',sans-serif;font-size:19px;padding:12px 24px}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chip{background:#ffffff12;border:1px solid #ffffff22;border-radius:999px;padding:8px 14px;font-size:16px;white-space:nowrap}
.timer{font-family:'Jua',sans-serif;font-size:clamp(24px,3vw,34px);color:var(--gold);min-width:110px;text-align:right;font-variant-numeric:tabular-nums}

/* home */
.hero{text-align:center;padding:5vh 0 3vh}
.hero .tag{display:inline-block;color:var(--gold);border:1px solid #ffd16655;border-radius:999px;padding:6px 14px;font-size:15px;margin-bottom:14px}
.hero h1{font-size:clamp(34px,6vw,64px);line-height:1.15;text-shadow:0 4px 30px #6c5cff66}
.hero p{color:var(--muted);margin-top:12px;font-size:18px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:22px}
.mode{background:linear-gradient(160deg,#1d2552,#121836);border:1px solid #ffffff1f;border-radius:22px;padding:24px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:10px;transition:.2s;position:relative;overflow:hidden}
.mode:hover{transform:translateY(-4px);border-color:#ffffff55}
.mode .num{font-family:'Jua';font-size:15px;color:var(--gold)}
.mode h3{font-size:28px}
.mode p{color:var(--muted);font-size:16px;line-height:1.55}
.mode .go{margin-top:auto;font-family:'Jua';font-size:18px;color:var(--gold)}
.mode .deco{position:absolute;right:-18px;top:-18px;width:110px;height:110px;border-radius:50%;opacity:.25}
.mode.m0 .deco{background:var(--gold)} .mode.m1 .deco{background:var(--order)} .mode.m2 .deco{background:var(--photo)} .mode.m3 .deco{background:var(--text)}

/* cards */
.card{position:relative;aspect-ratio:3/4;perspective:900px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.card .in{position:absolute;inset:0;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card.up .in{transform:rotateY(180deg)}
.card .face,.card .back{position:absolute;inset:0;border-radius:var(--r);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 6px 18px #0007}
.card .face{transform:rotateY(180deg);background:#fff;color:#1b1f3b;display:flex;flex-direction:column}
.card .back{display:grid;place-items:center;border:3px solid #ffffffcc}
.back.b-order{background:repeating-linear-gradient(45deg,var(--order) 0 10px,var(--order2) 10px 20px)}
.back.b-photo{background:repeating-linear-gradient(45deg,var(--photo) 0 10px,var(--photo2) 10px 20px)}
.back.b-text{background:repeating-linear-gradient(45deg,var(--text) 0 10px,var(--text2) 10px 20px)}
.back .emb{width:58%;aspect-ratio:1;border-radius:50%;background:#0b1030;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 0 0 4px #0002}
.back .emb svg{width:62%;height:62%}
.back .lbl{position:absolute;bottom:8%;font-family:'Jua';font-size:clamp(11px,1.2vw,15px);color:#fff;background:#0006;padding:2px 10px;border-radius:999px}
.face img{width:100%;flex:1;min-height:0;object-fit:cover;display:block;background:#eef}
.face .cap{word-break:keep-all;padding:6px 6px 8px;text-align:center;font-family:'Jua';font-size:clamp(12px,1.25vw,17px);line-height:1.2}
.face .cap small{display:block;font-family:'Gowun Dodum';font-size:.78em;color:#555;margin-top:2px}
.face.photo-only img{height:100%}
.face.textface{justify-content:center;align-items:center;padding:8px 8px 24px;text-align:center;background:linear-gradient(170deg,#f2fdff,#d6f4f8)}
.textface .t{word-break:keep-all;font-family:'Jua';font-size:clamp(14px,1.45vw,21px);line-height:1.25;color:#0d4f5a}
.textface .q{font-size:clamp(11px,1.15vw,15px);line-height:1.45;margin-top:8px;color:#1b3a44;word-break:keep-all}
.card.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.08)}}
.card.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* order game */
.lane-label{display:flex;justify-content:space-between;color:var(--muted);font-size:15px;margin:6px 2px 8px}
.lane-label b{color:var(--ink);font-family:'Jua';font-weight:400;font-size:18px}
.grid9{display:grid;grid-template-columns:repeat(9,1fr);gap:10px}
@media (max-width:900px){.grid9{grid-template-columns:repeat(3,1fr);max-width:520px;margin:0 auto}}
.slot{position:relative;aspect-ratio:3/4;border:2px dashed #ffffff40;border-radius:var(--r);display:grid;place-items:center}
.slot .n{font-family:'Jua';font-size:30px;color:#ffffff40}
.slot .card{position:absolute;inset:0}
.slot.locked .face{outline:4px solid var(--ok);outline-offset:-4px}
.slot .yr{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--ok);color:#06301f;font-family:'Jua';font-size:14px;padding:1px 9px;border-radius:999px;z-index:3;white-space:nowrap}
.pool-wrap{margin-top:22px;background:#ffffff08;border:1px solid #ffffff14;border-radius:20px;padding:12px 12px 14px}
.pool .cell{aspect-ratio:3/4;position:relative}
.pool .cell .card{position:absolute;inset:0}
.msg{min-height:30px;text-align:center;margin:12px 0 2px;font-size:18px}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.center{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.namebox{display:flex;gap:8px;align-items:center}
input[type=text]{background:#ffffff14;border:1px solid #ffffff33;border-radius:999px;color:var(--ink);padding:10px 14px;font-size:16px;font-family:inherit;width:150px}
input[type=text]:focus{outline:2px solid var(--gold)}

/* match game */
.boards{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
@media (max-width:760px){.boards{grid-template-columns:1fr}}
.board h3{font-size:20px;margin-bottom:8px;display:flex;justify-content:center;align-items:center;gap:8px}
.dot{width:14px;height:14px;border-radius:4px;display:inline-block}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:min(100%,calc((100vh - 300px) * .75 + 20px));min-width:min(100%,300px);margin:0 auto}
@media (max-width:760px){.grid3{max-width:440px}}
.card.taken .face{box-shadow:0 0 0 4px var(--pc,var(--ok)),0 6px 18px #0007}
.card.taken{cursor:default}
.card.taken::after{content:attr(data-who);position:absolute;bottom:6px;right:6px;background:var(--pc,var(--ok));color:#111;font-family:'Jua';font-size:13px;padding:1px 8px;border-radius:999px;z-index:4}
.players{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.pl{background:#ffffff10;border:2px solid transparent;border-radius:16px;padding:6px 14px;min-width:130px;transition:.2s}
.pl.on{border-color:var(--pc);background:#ffffff1c;transform:translateY(-2px);box-shadow:0 0 22px -6px var(--pc)}
.pl .nm{font-family:'Jua';font-size:18px;display:flex;align-items:center;gap:6px}
.pl .sc{font-family:'Jua';font-size:26px;color:var(--pc)}
.pl .thumbs{display:flex;gap:3px;margin-top:4px;min-height:22px;flex-wrap:wrap;max-width:200px}
.pl .thumbs img{width:22px;height:22px;object-fit:cover;border-radius:4px}
.turn{text-align:center;font-family:'Jua';font-size:22px;margin-bottom:6px}

/* setup */
.panel{background:linear-gradient(160deg,#1d2552,#121836);border:1px solid #ffffff22;border-radius:22px;padding:24px;max-width:620px;margin:0 auto}
.panel h3{font-size:22px;margin:4px 0 12px}
.seg{display:flex;background:#ffffff10;border-radius:999px;padding:4px;gap:4px;margin-bottom:18px}
.seg button{flex:1;padding:10px;border-radius:999px;background:transparent;color:var(--muted);font-family:'Jua';font-size:17px}
.seg button.on{background:var(--gold);color:#2a1d00}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.row label{color:var(--muted);min-width:80px}
.check{display:flex;gap:8px;align-items:center;color:var(--muted);margin:6px 0 16px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--gold)}
.rules{color:var(--muted);font-size:15px;line-height:1.7;margin:4px 0 18px;padding-left:18px}


/* quiz */
.qwrap{max-width:820px;margin:0 auto}
.prog{height:10px;background:#ffffff14;border-radius:999px;overflow:hidden;margin-bottom:18px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff8a3d);transition:width .3s}
.qcard{background:linear-gradient(160deg,#1d2552,#121836);border:1px solid #ffffff22;border-radius:24px;padding:28px 26px;text-align:center}
.qno{display:inline-block;font-family:'Jua';color:var(--gold);font-size:18px;border:1px solid #ffd16655;border-radius:999px;padding:3px 14px}
.qtype{color:var(--muted);font-size:14px;margin-left:6px}
.qtext{font-family:'Jua';font-size:clamp(22px,3vw,32px);line-height:1.45;margin:18px 0 22px;word-break:keep-all}
.ox{display:flex;gap:18px;justify-content:center}
.ox button{width:min(42%,190px);aspect-ratio:1.3;border-radius:22px;font-family:'Jua';font-size:clamp(56px,8vw,86px);color:#fff;border:4px solid #ffffff44;transition:.15s}
.ox .o{background:#2f74e0}.ox .x{background:#e04a5f}
.ox button:hover:not(:disabled){transform:translateY(-3px)}
.ox button:disabled{opacity:.35}
.ox button.pick{opacity:1;outline:5px solid var(--gold);outline-offset:3px}
.ox button.right{outline:5px solid var(--ok);outline-offset:3px}
.ans-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ans-row input{width:min(100%,420px);font-size:20px;padding:14px 18px;text-align:center}
.qtools{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.hintbox{margin-top:12px;font-family:'Jua';font-size:24px;letter-spacing:4px;color:#b8c4ff;min-height:30px}
.fb{margin-top:18px;border-radius:16px;padding:14px 16px;font-size:18px;line-height:1.5}
.fb.ok{background:#3ddc9722;border:1px solid #3ddc9777}
.fb.bad{background:#ff5d7322;border:1px solid #ff5d7377}
.fb .a{font-family:'Jua';font-size:24px;color:var(--gold);display:block;margin-top:4px}
.fb .h{font-family:'Jua';font-size:22px}
.score-big{font-family:'Jua';font-size:64px;color:var(--gold)}
.review{text-align:left;margin-top:16px;display:flex;flex-direction:column;gap:8px}
.review .it{background:#ffffff0c;border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.5;border-left:4px solid var(--ok)}
.review .it.x{border-left-color:var(--bad)}
.review .it b{color:var(--gold);font-weight:400;font-family:'Jua';font-size:16px}
.review .it .me{color:#ff9aa8}

.mc{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}
@media (max-width:640px){.mc{grid-template-columns:1fr}}
.mc button{display:flex;align-items:center;gap:12px;background:#ffffff10;border:2px solid #ffffff2a;color:var(--ink);border-radius:16px;padding:16px 18px;font-size:clamp(16px,1.8vw,20px);line-height:1.4;transition:.15s;word-break:keep-all;text-align:left}
.mc button:hover:not(:disabled){background:#ffffff22;border-color:var(--gold);transform:translateY(-2px)}
.mc .mn{font-family:'Jua';font-size:24px;color:var(--gold);flex:none}
.mc button:disabled{cursor:default;opacity:.45}
.mc button.right,.ox button.right{opacity:1;background:#3ddc9733;border-color:var(--ok)}
.mc button.wrong{opacity:1;background:#ff5d7333;border-color:var(--bad)}
.ox button.wrong{opacity:1}
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.qsi{background:#ffffff0c;border:1px solid #ffffff1c;border-radius:16px;padding:14px 16px;text-align:left;color:var(--ink);font-size:17px;line-height:1.5;word-break:keep-all;display:flex;flex-direction:column;gap:10px;transition:.15s}
.qsi:hover{border-color:#ffffff55}
.qsi .n{font-family:'Jua';color:var(--gold);margin-right:6px}
.qsi .ty{font-size:13px;color:var(--muted);margin-left:4px}
.qsi .ans{border-radius:10px;padding:8px 12px;font-family:'Jua';font-size:19px;background:repeating-linear-gradient(45deg,#ffffff14 0 8px,#ffffff08 8px 16px);color:transparent;position:relative;margin-top:auto}
.qsi .ans::after{content:'👆 눌러서 정답 보기';position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-family:'Gowun Dodum';font-size:15px}
.qsi.open .ans{background:#3ddc9722;color:var(--ok)}
.qsi.open .ans::after{content:none}
.explorer{max-width:900px;margin:0 auto 6px;background:linear-gradient(160deg,#1d2552,#121836);border:1px solid #ffffff22;border-radius:22px;padding:18px 22px}
.ex-start{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.ex-start input{width:220px;font-size:18px}
.ex-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ex-head .who{font-family:'Jua';font-size:24px;margin-right:auto}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:640px){.steps{grid-template-columns:1fr 1fr}}
.step{background:#ffffff0a;border:1px solid #ffffff1a;border-radius:14px;padding:10px 12px;text-align:center}
.step .ic{font-size:24px}
.step .nm{font-family:'Jua';font-size:16px;margin-top:2px}
.step .st{font-size:13px;color:var(--muted);margin-top:2px}
.step.done{border-color:var(--ok);background:#3ddc9718}
.step.done .st{color:var(--ok)}
.step.now{border-color:var(--gold);box-shadow:0 0 18px -6px var(--gold)}
.step.cert.done{border-color:var(--gold);background:#ffd16622;cursor:pointer}
.mode.locked{opacity:.5;filter:grayscale(.7)}
.mode.locked:hover{transform:none}
.mode .lockmsg{display:none;font-family:'Jua';font-size:16px;color:#ffb3bf}
.mode.locked .lockmsg{display:block}
.mode.locked .go{display:none}
.mode .donemark{display:none;position:absolute;top:16px;right:18px;font-family:'Jua';background:var(--ok);color:#06301f;border-radius:999px;padding:2px 10px;font-size:14px;z-index:2}
.mode.done .donemark{display:block}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2a1d00;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:12px 22px;font-size:17px;z-index:70;animation:rise .3s}
.passbar{position:relative;height:16px;background:#ffffff14;border-radius:999px;margin:14px auto 6px;max-width:420px;overflow:visible}
.passbar i{display:block;height:100%;border-radius:999px}
.passbar .line{position:absolute;left:80%;top:-6px;bottom:-6px;width:3px;background:var(--gold)}
.passbar .line::after{content:'80점';position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--gold);white-space:nowrap}
.cert-img{width:100%;border-radius:10px;box-shadow:0 10px 40px #0009;display:block}
.modal .box.wide{max-width:980px}
/* modal */
.modal{position:fixed;inset:0;background:#05081acc;display:grid;place-items:center;z-index:50;padding:16px;backdrop-filter:blur(4px)}
.modal .box{background:linear-gradient(160deg,#232c62,#141a3e);border:1px solid #ffffff33;border-radius:24px;padding:26px;max-width:560px;width:100%;text-align:center;max-height:90vh;overflow:auto;animation:rise .35s}
@keyframes rise{from{transform:translateY(20px);opacity:0}}
.box h2{font-size:34px;color:var(--gold)}
.box .big{font-family:'Jua';font-size:46px;margin:6px 0}
.box p{color:var(--muted)}
.lb{margin:16px auto 6px;text-align:left;width:100%;border-collapse:collapse;font-size:16px}
.lb th{white-space:nowrap;color:var(--muted);font-weight:400;font-size:14px;padding:4px 8px;border-bottom:1px solid #ffffff22}
.lb td{padding:7px 8px;border-bottom:1px solid #ffffff12}
.lb tr.me td{color:var(--gold);font-weight:700}
.lb td.r{font-family:'Jua';width:40px}

/* study */
.tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tli{background:#ffffff0c;border:1px solid #ffffff1c;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.tli .ph{height:170px;background:#fff;position:relative}
.tli .ph img{width:100%;height:100%;object-fit:cover}
.tli .ord{position:absolute;top:8px;left:8px;background:var(--gold);color:#2a1d00;font-family:'Jua';border-radius:999px;width:32px;height:32px;display:grid;place-items:center;font-size:17px}
.tli .bd{padding:12px 14px 16px}
.tli .dt{color:var(--gold);font-family:'Jua';font-size:16px}
.tli h4{font-family:'Jua';font-weight:400;font-size:21px;margin:2px 0 4px}
.tli .qt{font-size:14px;color:#cfe;margin-bottom:6px}
.tli .ds{color:var(--muted);font-size:15px;line-height:1.55}
.foot{color:#7d86b0;text-align:center;font-size:13px;margin-top:28px}
.confetti{position:fixed;top:-10px;width:9px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

/* ===== live quiz ===== */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:820px;margin:10px auto}
@media (max-width:700px){.duo{grid-template-columns:1fr}}
.pane{background:linear-gradient(160deg,#1d2552,#121836);border:1px solid #ffffff22;border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px;text-align:center}
.pane h3{font-size:24px}
.pane p{color:var(--muted);font-size:15px}
input.in,select.in{background:#ffffff12;border:2px solid #ffffff2a;color:var(--ink);border-radius:14px;padding:13px 14px;font-size:20px;font-family:inherit;text-align:center;width:100%}
input.in:focus,select.in:focus{outline:none;border-color:var(--gold)}
select.in option{color:#111}
.bigcode{font-family:'Jua';font-size:clamp(64px,13vw,140px);letter-spacing:.12em;color:var(--gold);text-shadow:0 6px 40px #ffd16655;line-height:1.1}
.center{text-align:center}
.pls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px auto;max-width:980px}
.pls .chip{font-size:19px;animation:rise .3s}
.hint{color:var(--muted);font-size:17px;margin:8px 0}
.hbar{height:12px;background:#ffffff14;border-radius:999px;overflow:hidden;margin:6px 0 16px}

function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}return()=>{h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);h^=h>>>16;return(h>>>0)/4294967296}}

async function createRoom(){

function nextQ(){const r=S.room;const qi=r.qi+1;S.revealing=false;
  if(qi>=total())return update(R(),{state:'final',finalAt:serverTimestamp()});
  return update(R(),{state:'question',qi,qStart:serverTimestamp()})}
async function reveal(){
  const r=S.room;if(!r||r.state!=='question'||S.revealing)return;S.revealing=true;
  const qi=r.qi,it=qa(qi),ci=getOpts(qi).indexOf(it.ox||it.a),lim=r.limit*1000,A=r.answers?.[qi]||{};
  const res={};let fast=null;
  for(const [pid,a] of Object.entries(A)){if(!r.players?.[pid])continue;
    const ms=Math.min(Math.max(+a.ms||0,0),lim),ok=a.c===ci;
    res[pid]={ok,ms,pts:ok?Math.round(1000*(1-.5*ms/lim)):0};
    if(ok&&(!fast||ms<res[fast].ms))fast=pid}
  const up={state:'reveal',['fast/'+qi]:fast||''};
  for(const [pid,x] of Object.entries(res)){
    if(x.ok){const p={score:0,correct:0,fastCnt:0,msSum:0,...r.players[pid]};
      if(pid===fast){x.pts+=100;x.bonus=100;p.fastCnt++}
      up['players/'+pid+'/score']=p.score+x.pts;up['players/'+pid+'/correct']=p.correct+1;
      up['players/'+pid+'/fastCnt']=p.fastCnt;up['players/'+pid+'/msSum']=p.msSum+x.ms}
    up['results/'+qi+'/'+pid]=x}
  await update(R(),up);
}
setInterval(()=>{const r=S.room;if(S.role!=='host'||!r||r.state!=='question'||typeof r.qStart!=='number')return;
  const el=now()-r.qStart,n=Object.keys(r.players||{}).length,done=Object.keys(r.answers?.[r.qi]||{}).length;
  if(el>=r.limit*1000+400||(n>0&&done>=n&&el>700))reveal()},250);
setInterval(()=>{const r=S.room;if(!r||r.state!=='question'||typeof r.qStart!=='number')return;
  const l=leftMs(r),t=$('#tm'),b=$('#tbar');if(t)t.textContent=Math.ceil(l/1000);if(b)b.style.width=(l/(r.limit*1000)*100)+'%'},100);
setInterval(()=>{const r=S.room;if(r&&r.state==='final'&&typeof r.finalAt==='number'&&now()-r.finalAt<9000)render()},700);

/* ---------- player actions ---------- */
async function pick(k){
  const r=S.room;if(!r||r.state!=='question'||S.picked[r.qi]!==undefined)return;
  const ms=now()-r.qStart;if(ms>r.limit*1000+300)return toast('시간이 끝났어요');
  S.picked[r.qi]=k;tone(440,.08);render();
  try{await set(R('answers/'+r.qi+'/'+S.pid),{c:k,ms:Math.max(0,Math.round(ms))})}catch(e){toast('전송에 실패했어요')}
}

/* ---------- render ---------- */
function render(){
  const r=S.room;if(!r||!S.role)return;
  const st=r.state;
  if(st==='lobby')return S.role==='host'?hostLobby(r):playerLobby(r);
  if(st==='question')return S.role==='host'?hostQ(r):playerQ(r);
  if(st==='reveal')return S.role==='host'?hostReveal(r):playerReveal(r);
  if(st==='final')return finalScreen(r);
}
const topbar=(title,right='')=>`<div class="bar"><h2>${title}</h2>${right}<button class="btn smallbtn" id="lv">${S.role==='host'?'방 닫기':'나가기'}</button></div>`;
function bindLeave(){const b=$('#lv');if(!b)return;let armed=false;b.onclick=async()=>{
  if(S.role==='host'){if(!armed){armed=true;b.textContent='정말 닫기?';setTimeout(()=>{armed=false;if(b.isConnected)b.textContent='방 닫기'},2500);return}
    const c=S.code;await remove(ref(db,'rooms/'+c));leave()}
  else{try{await remove(R('players/'+S.pid))}catch(e){}leave()}}}
const plChips=()=>plist().map(p=>`<span class="chip">${esc(p.name)}</span>`).join('');

function hostLobby(r){
  const n=Object.keys(r.players||{}).length;
  app.innerHTML=`${topbar('🚀 우주탐사의 역사 퀴즈 대결')}
  <div class="center"><p class="hint">학생 기기에서 이 페이지를 열고 <b>학생 → 방 코드</b>를 입력하세요</p><div class="bigcode">${S.code}</div>
  <p class="hint">문제 ${total()}개 · 문제당 ${r.limit}초 · 참여 <b style="color:var(--gold)">${n}</b>명</p>
  <div class="pls">${plChips()||'<span class="hint">아직 아무도 없어요…</span>'}</div>
  <button class="btn primary" id="st" ${n?'':'disabled'}>퀴즈 시작! 🚀</button></div>`;
  $('#st').onclick=()=>{tone(1,.01);hostStart()};bindLeave();
}
function playerLobby(r){
  app.innerHTML=`${topbar('입장 완료!')}<div class="center"><div class="resbig">🪐</div>
  <p class="status">${esc(S.name)} 님, 잘 들어왔어요</p><p class="hint">선생님이 시작할 때까지 기다려 주세요</p>
  <div class="pls">${plChips()}</div></div>`;bindLeave();
}

function qHead(r,extra=''){const n=total(),it=qa(r.qi);
  return `<div class="prog"><i style="width:${(r.qi+(r.state==='reveal'?1:0))/n*100}%"></i></div>
  <div class="hbar"><i id="tbar" style="width:${r.state==='question'?leftMs(r)/(r.limit*1000)*100:0}%"></i></div>
  <div class="qcard"><span class="qno">${r.qi+1} / ${n}</span><span class="qtype">${it.ox?'O / X':'객관식'}</span>${extra}
  <div class="qtext">${esc(it.q)}</div>`}

function hostQ(r){
  const it=qa(r.qi),o=getOpts(r.qi),done=Object.keys(r.answers?.[r.qi]||{}).length,n=Object.keys(r.players||{}).length;
  const body=it.ox?`<div class="oxrow">${o.map((x,k)=>`<div class="opt ob${k}">${x}</div>`).join('')}</div>`
   :`<div class="opts">${o.map((x,k)=>`<div class="opt c${k}"><span class="mn">${'①②③④'[k]}</span><span>${esc(x)}</span></div>`).join('')}</div>`;
  app.innerHTML=`${topbar('문제 풀이 중',`<span class="chip">제출 ${done} / ${n}</span><span class="timer" id="tm">${Math.ceil(leftMs(r)/1000)}</span>`)}
  ${qHead(r)}${body}<div style="margin-top:18px"><button class="btn" id="sk">지금 결과 보기</button></div></div>`;
  $('#sk').onclick=reveal;bindLeave();
}
function playerQ(r){
  const it=qa(r.qi),o=getOpts(r.qi),mine=S.picked[r.qi];
  const body=it.ox?`<div class="oxrow">${o.map((x,k)=>`<button class="opt ob${k} ${mine===undefined?'':mine===k?'mine':'dim'}" data-k="${k}" ${mine===undefined?'':'disabled'}>${x}</button>`).join('')}</div>`
   :`<div class="opts">${o.map((x,k)=>`<button class="opt c${k} ${mine===undefined?'':mine===k?'mine':'dim'}" data-k="${k}" ${mine===undefined?'':'disabled'}><span class="mn">${'①②③④'[k]}</span><span>${esc(x)}</span></button>`).join('')}</div>`;
  app.innerHTML=`${topbar(esc(S.name),`<span class="timer" id="tm">${Math.ceil(leftMs(r)/1000)}</span>`)}
  ${qHead(r)}${body}<div class="status">${mine===undefined?'정답을 골라요!':'제출 완료! 결과를 기다려요 ⏳'}</div></div>`;
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>pick(+b.dataset.k));bindLeave();
}

let lastRevealSfx=-1;
function hostReveal(r){
  const it=qa(r.qi),o=getOpts(r.qi),ci=o.indexOf(it.ox||it.a),A=r.answers?.[r.qi]||{},res=r.results?.[r.qi]||{};
  const cnt=o.map((_,k)=>Object.values(A).filter(a=>a.c===k).length),tot=Object.keys(A).length||1;
  const row=(x,k)=>`<div class="opt ${it.ox?'ob'+k:'c'+k} ${k===ci?'right':'dim'}"><div class="fill" style="width:${cnt[k]/tot*100}%"></div><span class="mn">${it.ox?'':'①②③④'[k]}</span><span>${esc(x)}</span><span class="cnt">${cnt[k]}명</span></div>`;
  const body=it.ox?`<div class="oxrow">${o.map((x,k)=>`<div class="opt ob${k} ${k===ci?'right':'dim'}" style="flex-direction:column;gap:2px">${x}<span class="cnt" style="margin:0;font-size:24px">${cnt[k]}명</span></div>`).join('')}</div>`
   :`<div class="opts">${o.map(row).join('')}</div>`;
  const f=r.fast?.[r.qi],fp=f&&r.players?.[f];
  const top=ranked().slice(0,5);
  const last=r.qi===total()-1;
  app.innerHTML=`${topbar('정답 공개',`<span class="chip">정답 ${Object.values(res).filter(x=>x.ok).length} / ${Object.keys(r.players||{}).length}명</span>`)}
  ${qHead(r)}${body}
  ${fp?`<div class="fastbox">⚡ 가장 빨리 맞힌 사람: <b style="color:var(--gold)">${esc(fp.name)}</b> (${sec(res[f].ms)})</div>`:'<div class="fastbox">아무도 못 맞혔어요 😅</div>'}</div>
  <div class="board">${top.map((p,i)=>`<div class="row"><span class="rk">${i+1}</span><span class="nm">${esc(p.name)}${res[p.id]?.pts?`<span class="sub">+${res[p.id].pts}</span>`:''}</span><span class="sc">${p.score}</span></div>`).join('')}</div>
  <div class="center" style="margin-top:20px"><button class="btn primary" id="nx">${last?'최종 결과 발표 🏆':'다음 문제 →'}</button></div>`;
  $('#nx').onclick=()=>{tone(1,.01);nextQ()};bindLeave();
  if(lastRevealSfx!==r.qi){lastRevealSfx=r.qi;sfx.fan()}
}
function playerReveal(r){
  const res=r.results?.[r.qi]?.[S.pid],it=qa(r.qi),o=getOpts(r.qi),ci=o.indexOf(it.ox||it.a),rk=ranked(),my=rk.findIndex(p=>p.id===S.pid)+1,me=r.players?.[S.pid]||{score:0};
  const f=r.fast?.[r.qi];
  app.innerHTML=`${topbar(esc(S.name))}<div class="qcard center"><span class="qno">${r.qi+1} / ${total()}</span>
  <div class="resbig">${res?(res.ok?'⭕':'❌'):'⏰'}</div>
  <p class="pts">${res?(res.ok?'+'+res.pts+'점':'0점'):'시간 초과'}</p>
  ${res?.bonus?'<div class="fastbox">⚡ 가장 빨리 맞혔어요! (+100)</div>':''}
  <p class="hint" style="margin-top:14px">정답: <b style="color:var(--ok)">${esc(it.ox||it.a)}</b></p>
  <p class="status">현재 ${my}등 · ${me.score}점</p><p class="hint">다음 문제를 기다려요…</p></div>`;bindLeave();
  if(lastRevealSfx!==r.qi){lastRevealSfx=r.qi;(res?.ok?sfx.ok:sfx.bad)()}
}

function awards(r){
  const P=plist(),out=[];
  const bc=[...P].sort((a,b)=>b.correct-a.correct||avg(a)-avg(b))[0];
  const bf=[...P].filter(p=>p.fastCnt>0).sort((a,b)=>b.fastCnt-a.fastCnt||avg(a)-avg(b))[0];
  const ba=[...P].filter(p=>p.correct>0).sort((a,b)=>avg(a)-avg(b))[0];
  let best=null;for(const [qi,m] of Object.entries(r.results||{}))for(const [pid,x] of Object.entries(m))if(x.ok&&(!best||x.ms<best.ms)&&r.players?.[pid])best={pid,ms:x.ms,qi:+qi};
  if(bc&&bc.correct>0)out.push({ic:'🎯',tt:'정답왕',nn:bc.name,dd:`${total()}문제 중 ${bc.correct}개 정답`});
  if(bf)out.push({ic:'⚡',tt:'스피드왕 (가장 빨리 맞힌 횟수)',nn:bf.name,dd:`${bf.fastCnt}번 1등`});
  if(best)out.push({ic:'🌠',tt:'번개 기록 (가장 빠른 정답 한 번)',nn:r.players[best.pid].name,dd:`${best.qi+1}번 문제 · ${sec(best.ms)}`});
  if(ba)out.push({ic:'🏃',tt:'평균 정답 속도 1위',nn:ba.name,dd:`평균 ${sec(avg(ba))}`});
  return out;
}
function finalScreen(r){
  const rk=ranked(),t=typeof r.finalAt==='number'?now()-r.finalAt:99999;
  const stage=t<1500?0:t<3500?1:t<5500?2:t<7500?3:4;
  const pod=(i,c)=>rk[i]?`<div class="pcol p${c}"><div class="who">${esc(rk[i].name)}</div><div class="pt">${rk[i].score}점</div><div class="blk">${c}</div></div>`:'';
  let h=`${topbar('🏆 최종 결과')}<div class="center">`;
  if(stage===0)h+=`<div class="drum">두구두구두구… 🥁</div>`;
  else{h+=`<div class="podium">${stage>=2?pod(1,2):'<div class="pcol"></div>'}${stage>=3?pod(0,1):'<div class="pcol"></div>'}${stage>=1?pod(2,3):'<div class="pcol"></div>'}</div>`;
    if(stage===1)h+=`<p class="hint">3등 발표!</p>`;if(stage===2)h+=`<p class="hint">2등 발표!</p>`;if(stage===3)h+=`<p class="hint">그리고 1등은…</p>`}
  h+='</div>';
  if(stage>=4){
    h+=`<div class="board">${rk.map((p,i)=>`<div class="row ${p.id===S.pid?'me':''}"><span class="rk">${i+1}</span><span class="nm">${esc(p.name)}<span class="sub">정답 ${p.correct}개 · ⚡${p.fastCnt}</span></span><span class="sc">${p.score}</span></div>`).join('')}</div>
    <div class="awards">${awards(r).map(a=>`<div class="award"><div class="ic">${a.ic}</div><div class="tt">${a.tt}</div><div class="nn">${esc(a.nn)}</div><div class="dd">${a.dd}</div></div>`).join('')}</div>`;
    if(S.role==='player'){const my=rk.findIndex(p=>p.id===S.pid)+1;h+=`<p class="status center">내 순위 ${my}등 · ${r.players?.[S.pid]?.score||0}점</p>`}
  }
  app.innerHTML=h;bindLeave();
  if(stage>=1&&!S['f'+stage]){S['f'+stage]=1;sfx.tick();if(stage===3){sfx.fan();confetti()}}
}

/* ---------- resume ---------- */
(async()=>{
  if(!db)return;
  try{const h=JSON.parse(localStorage.getItem('qz_host')||'null');
    if(h&&(await get(ref(db,'rooms/'+h.code))).exists()){S.role='host';S.code=h.code;return attach()}
    const p=JSON.parse(localStorage.getItem('qz_pl')||'null');
    if(p&&(await get(ref(db,'rooms/'+p.code+'/players/'+p.pid))).exists()){Object.assign(S,{role:'player',code:p.code,pid:p.pid,name:p.name});return attach()}
  }catch(e){}
  home();
})();
home();

</script>
</body>
